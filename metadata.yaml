name: snowluma_go
display_name: Snowluma Go
short_desc: 一键部署 SnowLuma，并用官方 WebUI API 把 OneBot v11 接入 AstrBot
desc: >-
  SnowLuma 是面向 QQNT 的 OneBot v11 互操作运行时。本插件把「下载 / 安装 / 启动 /
  登录 / 挂载 QQ 进程 / 写入反向 WS 连接 / 热重载」全部自动化：不再手改 JSON，
  而是直接调用 SnowLuma 官方 WebUI REST API 完成配置与热重载，全程支持
  Windows / Linux，可管理多个 QQ 账号，并提供内嵌控制台页面。
version: 7.4.1
author: SATA-F5
